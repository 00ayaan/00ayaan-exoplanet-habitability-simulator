name: Deploy to GitHub Pages

# Builds the site, refreshing the NASA Exoplanet Archive snapshot first, and
# publishes to GitHub Pages. One-time setup: repo Settings → Pages →
# Source: "GitHub Actions".

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1' # weekly (Mon 09:17 UTC) refresh of archive data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Refresh NASA Exoplanet Archive snapshot
        # If the archive is unreachable, the committed snapshot (if any) is used.
        continue-on-error: true
        run: npm run data:fetch
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
