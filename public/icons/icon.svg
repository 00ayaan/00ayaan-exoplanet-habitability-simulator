<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Planet with orbit">
  <!-- Original icon: a small star, an elliptical orbit arc and a planet. Full-bleed background so it also works as maskable (safe zone = central 80%). -->
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1a2a55"/>
      <stop offset="100%" stop-color="#070b16"/>
    </radialGradient>
    <radialGradient id="planet" cx="38%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#a8f0d2"/>
      <stop offset="55%" stop-color="#3fb58a"/>
      <stop offset="100%" stop-color="#145c56"/>
    </radialGradient>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="60%" stop-color="#ffd27a"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="96" cy="120" r="3" fill="#cfe0ff" opacity=".7"/>
  <circle cx="420" cy="92" r="2.5" fill="#cfe0ff" opacity=".6"/>
  <circle cx="400" cy="420" r="3" fill="#cfe0ff" opacity=".5"/>
  <circle cx="130" cy="400" r="2" fill="#cfe0ff" opacity=".6"/>
  <ellipse cx="256" cy="256" rx="172" ry="92" fill="none" stroke="#7cc4ff" stroke-width="12" stroke-dasharray="26 18" stroke-linecap="round" transform="rotate(-20 256 256)" opacity=".9"/>
  <circle cx="200" cy="276" r="46" fill="url(#star)"/>
  <circle cx="200" cy="276" r="22" fill="#ffe7a8"/>
  <circle cx="368" cy="186" r="52" fill="url(#planet)"/>
  <path d="M322 196c30 10 62 6 92-8" stroke="#dffaf0" stroke-width="7" fill="none" opacity=".45" stroke-linecap="round"/>
</svg>
